<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080D18">
  <meta name="description" content="Pochland — Sigue la luz. Una experiencia interactiva en Godot 4.7 donde Poch persigue tu cursor resolviendo plataformas, cajas y bugs.">
  <title>$GODOT_PROJECT_NAME</title>
  <link rel="icon" href="index.icon.png" type="image/png">
  <style>
    :root {
      --bg: #080d18;
      --bg-2: #0b1220;
      --surface: #0f182f;
      --line: rgba(244, 233, 216, 0.14);
      --text: #f4e9d8;
      --muted: #93a1b5;
      --green: #21a64a;
      --green-bright: #58e27a;
      --cyan: #66e0d0;
      --mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    html, body, #canvas {
      margin: 0;
      padding: 0;
      border: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }

    body {
      color: var(--text);
      font-family: var(--mono);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      background: var(--bg);
    }

    #canvas:focus {
      outline: none;
    }

    #status {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(33, 166, 74, 0.12), transparent 55%),
        linear-gradient(180deg, #080d18 0%, #0b1220 55%, #080d18 100%);
      color: var(--text);
    }

    #status::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(244, 233, 216, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(244, 233, 216, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black, transparent 78%);
      pointer-events: none;
    }

    #status-splash {
      display: none;
    }

    .boot {
      position: relative;
      width: min(460px, 100%);
      text-align: center;
    }

    .boot-mark {
      display: inline-grid;
      place-items: center;
      width: 82px;
      height: 82px;
      margin: 0 auto 22px;
      background: #0b1422;
      border: 2px solid var(--green);
      box-shadow: 0 0 0 6px rgba(33, 166, 74, 0.08), 0 18px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .boot-mark img {
      width: 82%;
      height: 82%;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .boot-kicker {
      margin: 0 0 10px;
      font-size: 10px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--green-bright);
    }

    .boot-title {
      margin: 0;
      font-family: "Courier New", var(--mono);
      font-size: clamp(30px, 8vw, 50px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--text);
      text-shadow: 3px 0 0 rgba(88, 226, 122, 0.22), -3px 0 0 rgba(102, 224, 208, 0.14);
    }

    .boot-sub {
      margin: 9px 0 26px;
      font-size: 11px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .boot-meter {
      position: relative;
      width: 100%;
      height: 8px;
      background: rgba(244, 233, 216, 0.07);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    progress#status-progress {
      display: block;
      width: 100%;
      height: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: 0;
    }

    progress#status-progress::-webkit-progress-bar {
      background: transparent;
    }

    progress#status-progress::-webkit-progress-value {
      background: linear-gradient(90deg, var(--green), var(--green-bright));
      transition: width 180ms ease-out;
    }

    progress#status-progress::-moz-progress-bar {
      background: linear-gradient(90deg, var(--green), var(--green-bright));
    }

    .boot-status {
      margin: 13px 0 0;
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .boot-status .pct {
      color: var(--cyan);
    }

    .boot-foot {
      margin: 28px 0 0;
      font-size: 9px;
      line-height: 1.8;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(147, 161, 181, 0.62);
    }

    .boot-corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: rgba(88, 226, 122, 0.55);
      border-style: solid;
    }

    .boot-corner--tl { top: -12px; left: -12px; border-width: 1px 0 0 1px; }
    .boot-corner--tr { top: -12px; right: -12px; border-width: 1px 1px 0 0; }
    .boot-corner--bl { bottom: -12px; left: -12px; border-width: 0 0 1px 1px; }
    .boot-corner--br { bottom: -12px; right: -12px; border-width: 0 1px 1px 0; }

    #status-notice {
      display: none;
      position: relative;
      max-width: 560px;
      margin: 22px auto 0;
      padding: 16px 18px;
      border: 1px solid rgba(228, 88, 140, 0.42);
      background: rgba(49, 15, 27, 0.64);
      color: #ffd9e4;
      font-size: 12px;
      line-height: 1.6;
      text-align: left;
      white-space: pre-wrap;
    }

    .boot-retry {
      display: inline-block;
      margin-top: 14px;
      padding: 9px 14px;
      border: 1px solid rgba(244, 233, 216, 0.26);
      color: var(--text);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      background: rgba(244, 233, 216, 0.06);
    }

    .boot-retry:hover,
    .boot-retry:focus-visible {
      border-color: var(--green-bright);
      color: var(--green-bright);
      outline: none;
    }

    .failed .boot-meter,
    .failed .boot-status {
      display: none;
    }

    @media (max-width: 480px) {
      .boot-mark { width: 68px; height: 68px; }
      .boot-title { letter-spacing: 0.06em; }
      .boot-foot { line-height: 1.6; }
    }

    @media (prefers-reduced-motion: reduce) {
      progress#status-progress::-webkit-progress-value { transition: none; }
    }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" aria-label="Pochland, experiencia interactiva" tabindex="0">
    Tu navegador no soporta canvas HTML5.
  </canvas>

  <noscript>Pochland necesita JavaScript y WebAssembly para funcionar.</noscript>

  <div id="status" role="status" aria-live="polite">
    <img id="status-splash" src="$GODOT_SPLASH" alt="">
    <div class="boot">
      <span class="boot-corner boot-corner--tl" aria-hidden="true"></span>
      <span class="boot-corner boot-corner--tr" aria-hidden="true"></span>
      <span class="boot-corner boot-corner--bl" aria-hidden="true"></span>
      <span class="boot-corner boot-corner--br" aria-hidden="true"></span>
      <div class="boot-mark"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAABoklEQVR42u2ZsUoDQRRFZySKhbhWoohRUBQrRQgRFlLZ6BesHyHY5gtsBf9BC3ttrAQhi5VgI1hIQJB0EQuRgLbOK2Z4THbdkHO7Yd5OwuHduzM71pSsZGH75+94a3fDme9cX9mYeq0mzJgLAOMOwFbd8zPJtFP/9pw79UubTad+ea2uyggsAAAyoFjPSw9Lffa/jK8+NK/1PB0AAAAMNwNCnpcelirb83QAAABQbAbEejyUGaH15VmBDgAAAIabAdLzrXTeW99urKjWPzh7MJqzhNbzdAAAAFBsBmg9r82E/vuj95sg+wAsAACVakX/gPSw1M1JQ1XPPgALAKBa+4CQDiefnPFFd+CM5xZ3VPXWWksHAAAA1ckA+R6X6q7ue+frr7eq+izLyAAAAGCE7gVCGRH7PYAOAAAA/ncfMNX8cOa/89lC/zAZgAUAUG4GhDyv1fnRqar++LLtzZjYTMACADDcC0Rpr7bune8MXrye1q5HBwAAAOVmgHzPJrk4/6e6jLi77/kfSAPPmx4dAAAAjNDdoPY8r12fswAWAECUfgFTc4uXPFd0cwAAAABJRU5ErkJggg==" width="64" height="64" alt="Poch, el personaje de Pochland"></div>
      <p class="boot-kicker">Experiencia web // Godot 4.7</p>
      <h1 class="boot-title">Pochland</h1>
      <p class="boot-sub">Sigue la luz</p>
      <div class="boot-meter">
        <progress id="status-progress"></progress>
      </div>
      <p class="boot-status" id="boot-status">Estableciendo enlace <span class="pct">0%</span></p>
      <div id="status-notice"></div>
      <p class="boot-foot">Godot 4.7 · build web single-thread<br>Mueve el cursor · Poch resuelve el resto</p>
    </div>
  </div>

  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
    const engine = new Engine(GODOT_CONFIG);

    (function () {
      const statusOverlay = document.getElementById("status");
      const statusProgress = document.getElementById("status-progress");
      const statusNotice = document.getElementById("status-notice");
      const bootStatus = document.getElementById("boot-status");

      let initializing = true;
      let statusMode = "";

      function setStatusMode(mode) {
        if (statusMode === mode || !initializing) {
          return;
        }
        if (mode === "hidden") {
          if (statusOverlay) statusOverlay.remove();
          initializing = false;
          return;
        }
        if (mode === "notice") {
          statusOverlay.classList.add("failed");
        }
        if (statusNotice) {
          statusNotice.style.display = mode === "notice" ? "block" : "none";
        }
        statusMode = mode;
      }

      function setStatusNotice(text) {
        if (!statusNotice) return;
        statusNotice.textContent = text;
        const retry = document.createElement("a");
        retry.className = "boot-retry";
        retry.href = window.location.href;
        retry.textContent = "Reintentar";
        statusNotice.appendChild(document.createElement("br"));
        statusNotice.appendChild(retry);
      }

      function setProgress(pct) {
        if (bootStatus) {
          bootStatus.innerHTML = 'Estableciendo enlace <span class="pct">' + pct + "%</span>";
        }
      }

      function displayFailureNotice(err) {
        console.error(err);
        if (err instanceof Error) {
          setStatusNotice(err.message);
        } else if (typeof err === "string") {
          setStatusNotice(err);
        } else {
          setStatusNotice("No se pudo iniciar la experiencia.");
        }
        setStatusMode("notice");
        initializing = false;
      }

      const missing = Engine.getMissingFeatures({
        threads: GODOT_THREADS_ENABLED,
      });

      if (missing.length !== 0) {
        if (GODOT_CONFIG["serviceWorker"] && GODOT_CONFIG["ensureCrossOriginIsolationHeaders"] && "serviceWorker" in navigator) {
          let serviceWorkerRegistrationPromise;
          try {
            serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
          } catch (err) {
            serviceWorkerRegistrationPromise = Promise.reject(new Error("No se pudo consultar el service worker."));
          }
          Promise.race([
            serviceWorkerRegistrationPromise.then((registration) => {
              if (registration != null) {
                return Promise.reject(new Error("Ya existe un service worker."));
              }
              return registration;
            }).then(() => engine.installServiceWorker()),
            new Promise((resolve) => setTimeout(resolve, 2000)),
          ]).then(() => {
            window.location.reload();
          }).catch((err) => {
            console.error("No se pudo registrar el service worker:", err);
          });
        } else {
          const missingMsg = "Faltan funciones del navegador para ejecutar Godot:\n" + missing.join("\n");
          displayFailureNotice(missingMsg);
        }
      } else {
        setStatusMode("progress");
        engine.startGame({
          onProgress: function (current, total) {
            if (current > 0 && total > 0) {
              statusProgress.value = current;
              statusProgress.max = total;
              setProgress(Math.round((current / total) * 100));
            } else {
              statusProgress.removeAttribute("value");
              statusProgress.removeAttribute("max");
              setProgress(0);
            }
          },
        }).then(() => {
          setStatusMode("hidden");
          const canvas = document.getElementById("canvas");
          if (canvas) {
            canvas.focus({ preventScroll: true });
          }
        }, displayFailureNotice);
      }
    }());
  </script>
</body>
</html>
